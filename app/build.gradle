apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

repositories {
    maven { url 'https://maven.google.com' }
}


android {
    namespace "com.alaruss.verbs"
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:deprecation"
    }

    defaultConfig {
        applicationId "com.alaruss.verbs"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 18
        versionName "1.7.2"
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'Boolean', 'enableCrashlytics', 'true'
            resValue "string", "app_name", "Verbs catalans"

            def admobAppId = localProperties.getProperty('admob_app_id')
            def admobBannerAdUnitId = localProperties.getProperty('admob_banner_ad_unit_id')
            if (admobAppId == null || admobBannerAdUnitId == null) {
                throw new GradleException("Missing AdMob IDs in local.properties. Add admob_app_id and admob_banner_ad_unit_id for release builds.")
            }
            resValue "string", "admob_app_id", admobAppId
            resValue "string", "admob_banner_ad_unit_id", admobBannerAdUnitId
        }
        debug {
            buildConfigField 'Boolean', 'enableCrashlytics', 'false'
            resValue "string", "app_name", "__Verbs catalans"
            applicationIdSuffix ".debug"
            resValue "string", "admob_app_id", "ca-app-pub-3940256099942544~3347511713"
            resValue "string", "admob_banner_ad_unit_id", "ca-app-pub-3940256099942544/6300978111"
        }
    }
    compileSdk {
        version = release(37)
    }
    buildToolsVersion '37.0.0'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.google.firebase:firebase-analytics:23.2.0'
    implementation 'com.google.firebase:firebase-crashlytics:20.1.0'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'

    // Room database
    implementation "androidx.room:room-runtime:2.8.4"
    annotationProcessor "androidx.room:room-compiler:2.8.4"

    // Lifecycle components for MVVM
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.11.0"
    implementation "androidx.lifecycle:lifecycle-livedata:2.11.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.11.0"

    // RecyclerView
    implementation "androidx.recyclerview:recyclerview:1.4.0"

    // Preferences
    implementation "androidx.preference:preference:1.2.1"

    // Encrypted SharedPreferences
    implementation "androidx.security:security-crypto:1.1.0"

    // Google Play Billing
    implementation "com.android.billingclient:billing:9.1.0"

    // Google Mobile Ads (AdMob)
    implementation "com.google.android.gms:play-services-ads:25.4.0"

    testImplementation 'junit:junit:4.13.2'
}
